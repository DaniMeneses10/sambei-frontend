<div class="min-h-screen bg-surface-900 flex items-center justify-center p-4">
    <div class="w-full max-w-md">

      <!-- Logo -->
      <div class="text-center mb-8">
          <h1 class="text-4xl font-bold text-primary-500">Sambei</h1>
          <p class="text-primary-400 text-xs font-medium tracking-widest mt-1">
              Smart Analytics for Markets, Bitcoin, ETFs & Investments
          </p>
          <p class="text-primary-400 text-xs font-medium tracking-widest mt-1">
              Analítica Inteligente para Mercados, Bitcoin, ETFs e Inversiones
          </p>
          <p class="text-slate-400 mt-2">Tu plataforma de inversión inteligente</p>
      </div>

      <!-- Card -->
      <app-card>

        <h2 class="text-2xl font-bold text-white mb-6">Iniciar sesión</h2>

        <!-- Error general -->
        @if (error()) {
          <div class="bg-danger/10 border border-danger text-danger rounded-xl p-3 mb-4 text-sm">
            {{ error() }}
          </div>
        }

        <!-- Formulario -->
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">

          <app-input
            label="Email"
            type="email"
            placeholder="tu@email.com"
            formControlName="email"
            [error]="form.controls.email.touched && form.controls.email.invalid ? 'Email inválido' : ''"/>

          <app-input
            label="Contraseña"
            type="password"
            placeholder="••••••••"
            formControlName="password"
            [error]="form.controls.password.touched && form.controls.password.invalid ? 'Mínimo 4 caracteres' : ''"/>

          <!-- Olvidé mi contraseña -->
          <div class="text-right">
            <a routerLink="/auth/forgot-password" class="text-sm text-primary-500 hover:text-primary-400">
              ¿Olvidaste tu contraseña?
            </a>
          </div>

          <app-button type="submit" [loading]="loading()">
            Iniciar sesión
          </app-button>

        </form>

        <!-- Link a Register -->
        <p class="text-center text-slate-400 text-sm mt-6">
          ¿No tienes cuenta?
          <a routerLink="/auth/register" class="text-primary-500 hover:text-primary-400 font-medium">
            Regístrate
          </a>
        </p>

      </app-card>
    </div>
  </div>

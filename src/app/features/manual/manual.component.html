<div class="min-h-screen bg-surface-900">

    <!-- Navbar — el logo hace de "volver al home", mismo criterio que /portfolio/:symbol -->
    <nav class="bg-surface-800 border-b border-slate-700 px-4 lg:px-6 py-4 flex items-center gap-4">
        <button (click)="goBack()"
                class="text-xl font-bold text-primary-500 hover:text-primary-400 transition-colors">
            Sambei
        </button>
        <span class="text-slate-500 text-sm">📖 Manual de uso</span>
    </nav>

    <main class="p-4 lg:p-6">

        @if (loading()) {
            <div class="min-h-[60vh] flex flex-col items-center justify-center gap-4">
                <div class="relative w-16 h-16">
                    <div class="absolute inset-0 rounded-full border-4 border-slate-700"></div>
                    <div class="absolute inset-0 rounded-full border-4 border-primary-500 border-t-transparent animate-spin"></div>
                </div>
                <p class="text-slate-400 text-sm animate-pulse">Cargando el manual…</p>
            </div>
        } @else if (error()) {
            <p class="text-danger text-sm">{{ error() }}</p>
        } @else {
            <div class="grid grid-cols-1 lg:grid-cols-[240px_1fr] gap-6 max-w-5xl mx-auto">

                <!-- Índice — fijo en desktop, oculto en mobile (el documento se lee igual de
                     corrido, mobile-first no necesita navegación lateral para esto) -->
                <aside class="hidden lg:block">
                    <nav class="sticky top-6 bg-surface-800 rounded-2xl p-4 max-h-[calc(100vh-3rem)] overflow-y-auto">
                        <p class="text-slate-500 text-xs font-semibold uppercase tracking-wide mb-2">Índice</p>
                        <ul class="flex flex-col gap-1">
                            @for (entry of toc(); track entry.id) {
                                <li>
                                    <a [href]="'#' + entry.id"
                                       (click)="scrollToSection(entry.id, $event)"
                                       [class.pl-3]="entry.level === 3"
                                       [class.text-xs]="entry.level === 3"
                                       class="block text-slate-400 hover:text-primary-400 text-sm py-0.5 transition-colors">
                                        {{ entry.text }}
                                    </a>
                                </li>
                            }
                        </ul>
                    </nav>
                </aside>

                <!-- Contenido -->
                <article
                    #articleEl
                    class="bg-surface-800 rounded-2xl p-5 lg:p-8 prose prose-invert max-w-none
                           prose-headings:scroll-mt-6
                           prose-h1:text-3xl prose-h1:mb-2
                           prose-h2:text-xl prose-h2:mt-10 prose-h2:pb-2 prose-h2:border-b prose-h2:border-slate-700
                           prose-h3:text-base prose-h3:mt-6 prose-h3:text-primary-400
                           prose-p:text-slate-300 prose-li:text-slate-300
                           prose-strong:text-white
                           prose-a:text-primary-400 prose-a:no-underline hover:prose-a:underline
                           prose-code:text-primary-300 prose-code:bg-surface-900 prose-code:px-1 prose-code:py-0.5 prose-code:rounded prose-code:before:content-none prose-code:after:content-none
                           prose-table:block prose-table:overflow-x-auto
                           prose-th:text-slate-300 prose-td:text-slate-400
                           prose-hr:border-slate-700
                           prose-blockquote:border-primary-500 prose-blockquote:text-slate-400"
                    [innerHTML]="contentHtml()">
                </article>
            </div>
        }
    </main>
</div>
